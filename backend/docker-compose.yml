services:
  api:
    build:
      context: .
      target: production
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-poonsuk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-poonsuk_dev_password}
      POSTGRES_DB: ${DB_NAME:-poonsuk}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-poonsuk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Reserved for Sprint 3 (cache / distributed lock / BullMQ broker).
  # Started now so compose does not need changing later.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
