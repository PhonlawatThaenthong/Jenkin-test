# kind cluster for Lab 07. Lets the node pull from the local registry
# (localhost:5001 on the host -> kind-registry:5000 inside the kind network).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry]
    config_path = "/etc/containerd/certs.d"
